services:
  # 1. PostgreSQL Database Container
  postgres-db:
    image: postgres:16-alpine
    container_name: auth-postgres-db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # 2. Redis Stack Container (Includes native RedisBloom for Password Bloom Filters & Rate Limiting)
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: auth-redis-stack
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data
    networks:
      - ecommerce-network

  # 3. MinIO Object Storage Container (Self-hosted S3 alternative for photos & avatars)
  minio-storage:
    image: minio/minio:latest
    container_name: auth-minio-storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_auth_data:/data
    networks:
      - ecommerce-network

  # 4. Auth & Identity Microservice Container
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-auth-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/auth_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-stack:
        condition: service_started
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_auth_data:
    driver: local
  redis_auth_data:
    driver: local
  minio_auth_data:
    driver: local
